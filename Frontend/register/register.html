<!DOCTYPE html>
<html lang="fr">
    
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JobAlligator – Register</title>
  <link rel="stylesheet" href="register.css">
</head>

<body>
  <div class="page">

    <div class="left">
      <div class="inner">
        <h1>Register</h1>
        <p>Hey enter your email to get an account</p>

        <button class="google-btn">
          <svg viewBox="0 0 48 48">
          </svg>
          Sign in with google
        </button>

        <div class="divider"><hr><span>or sign in with Email</span><hr></div>

        <input class="field" type="text" placeholder="Enter your username/email" />
        <input class="field" type="password" placeholder="Create your password" />
        <input class="field" type="text" placeholder="Confirm your password" />

        <div class="remember-row">
          <label><input type="checkbox" /> Remember</label>
          <a href="#">Forget password?</a>
        </div>

        <button class="login-btn">REGISTER</button>
        <p class="register">Already have an account? <a href="../Login/Login.html">Connect here!</a> </p>
      </div>
    </div>

    <div class="right">
      <h2>Welcome<span>to JobAlligator</span></h2>
      <p>Discover the tech opportunities you've been waiting for. Your dream stack and a better work-life balance are just one click away.</p>
      <div class="computer-icon">
        <div>
          <div class="monitor"></div>
          <div class="monitor-stand"></div>
          <div class="monitor-base"></div>
        </div>
        <div class="tower">
          <div class="tower-line"></div>
          <div class="tower-line"></div>
          <div class="tower-line"></div>
          <div class="tower-circle"></div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
